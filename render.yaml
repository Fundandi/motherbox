services:
  - type: web
    name: motherbox
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py seed_catalog --update
    startCommand: gunicorn maternabox.wsgi --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: motherbox-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "motherbox.dk,www.motherbox.dk,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://motherbox.dk,https://www.motherbox.dk"
      - key: SITE_URL
        value: "https://motherbox.dk"
databases:
  - name: motherbox-db
    plan: basic-256mb
    region: frankfurt
